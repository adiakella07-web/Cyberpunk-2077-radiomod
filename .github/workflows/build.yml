name: build-vortex-zip
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build RED4ext launcher plugin + audio helper
        run: |
          git clone --depth 1 https://github.com/WopsS/RED4ext.SDK launcher/RED4ext.SDK
          cmake -S launcher -B launcher/build -A x64
          cmake --build launcher/build --config Release
      - name: Cache librespot build
        id: ls-cache
        uses: actions/cache@v4
        with:
          path: librespot-src/target/release/librespot.exe
          key: librespot-win-v1
      - name: Build librespot (Spotify Connect receiver for standalone mode)
        if: steps.ls-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 30
        run: |
          git clone --depth 1 https://github.com/librespot-org/librespot librespot-src
          cargo build --release --manifest-path librespot-src/Cargo.toml --no-default-features --features "native-tls with-libmdns"
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - name: Build custom station icon (texture + archive)
        id: icon
        continue-on-error: true
        shell: pwsh
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          $ErrorActionPreference = "Continue"
          $log = New-Object System.Collections.Generic.List[string]
          function L($m) { $log.Add([string]$m) }
          function Run($label, [scriptblock]$sb) {
            $out = (& $sb 2>&1 | Out-String).Trim()
            L "[$label] exit=$LASTEXITCODE $($out.Substring(0, [Math]::Min(500, $out.Length)))"
          }
          Run "pillow" { python -m pip install pillow }
          Run "png" { python assets/icon/make_icon.py assets/icon/raw/mod/neondial/neon_dial_icon.png }
          Run "download" { gh release download 9.1.1 -R WolvenKit/WolvenKit -p "WolvenKit.Console-9.1.1.zip" -D wk --clobber }
          Expand-Archive wk/WolvenKit.Console-9.1.1.zip wk/cli -Force
          $cli = (Get-ChildItem wk/cli -Filter WolvenKit.CLI.exe -Recurse | Select-Object -First 1).FullName
          L "cli: $cli"
          New-Item -ItemType Directory -Force pack/NeonDial/mod/neondial | Out-Null
          Run "import" { & $cli import assets/icon/raw -o pack/NeonDial }
          Copy-Item assets/icon/neon_dial_icons.inkatlas pack/NeonDial/mod/neondial/
          L ("staged: " + ((Get-ChildItem pack -Recurse -File | ForEach-Object { $_.FullName.Replace($PWD.Path, "") }) -join "; "))
          Run "pack" { & $cli pack pack/NeonDial -o pack/out }
          L ("packed: " + ((Get-ChildItem pack/out -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object { "$($_.Name) $($_.Length)" }) -join "; "))
          Run "export" { & $cli export pack/NeonDial/mod/neondial/neon_dial_icon.xbm -o pack/check }
          L ("exported: " + ((Get-ChildItem pack/check -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName.Replace($PWD.Path, "") }) -join "; "))
          Run "verify" { python assets/icon/verify_icon.py pack/check }
          $text = $log -join " | "
          if ((Test-Path pack/out/NeonDial.archive) -and ($text -match "alpha range")) { Write-Output "::notice::ICON OK | $text" }
          else { Write-Output "::error::ICON PROBLEM | $text"; exit 1 }
      - name: Build companion exe
        working-directory: companion
        run: |
          python -m pip install -r requirements.txt pyinstaller
          python -m PyInstaller --noconfirm --onefile --windowed --name NeonDial --add-data "neondial/web;neondial/web" --collect-all webview --collect-all pythonnet --collect-all clr_loader run.py
      - name: Self-test the packaged app
        shell: pwsh
        env:
          NEONDIAL_AUDIO_HELPER: ${{ github.workspace }}\launcher\build\Release\NeonDialAudio.exe
          NEONDIAL_LIBRESPOT: ${{ github.workspace }}\librespot-src\target\release\librespot.exe
        run: |
          Start-Process -FilePath companion\dist\NeonDial.exe -ArgumentList "--selftest","selftest.txt" -Wait
          if (-not (Test-Path selftest.txt)) { Write-Output "::error::selftest produced no report (exe crashed at startup)"; exit 1 }
          $t = (Get-Content selftest.txt) -join " | "
          if ($t -match "SELFTEST OK") { Write-Output "::notice::$t" } else { Write-Output "::error::$t"; exit 1 }
      - name: Package for Vortex
        run: python tools/make_vortex_zip.py companion/dist/NeonDial.exe launcher/build/Release/NeonDial.dll launcher/build/Release/NeonDialAudio.exe NeonDial-vortex.zip librespot-src/target/release/librespot.exe pack/out/NeonDial.archive
      - uses: actions/upload-artifact@v4
        with: { name: NeonDial-vortex, path: NeonDial-vortex.zip }
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "${{ github.ref_name }}" NeonDial-vortex.zip --title "Neon Dial ${{ github.ref_name }}" --notes "Add NeonDial-vortex.zip to Vortex. Requires Cyber Engine Tweaks, RED4ext and RadioExt. Open your music app first, then tune to Neon Dial FM."
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
