name: build-vortex-zip
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build RED4ext launcher plugin + audio helper
        run: |
          git clone --depth 1 https://github.com/WopsS/RED4ext.SDK launcher/RED4ext.SDK
          cmake -S launcher -B launcher/build -A x64
          cmake --build launcher/build --config Release
      - name: Build librespot (Spotify Connect receiver for standalone mode)
        continue-on-error: true
        timeout-minutes: 30
        run: |
          git clone --depth 1 https://github.com/librespot-org/librespot librespot-src
          cargo build --release --manifest-path librespot-src/Cargo.toml --no-default-features --features "native-tls with-libmdns"
      - name: Build companion exe
        working-directory: companion
        run: |
          python -m pip install -r requirements.txt pyinstaller
          python -m PyInstaller --noconfirm --onefile --windowed --name NeonDial --add-data "neondial/web;neondial/web" --collect-all webview --collect-all pythonnet --collect-all clr_loader run.py
      - name: Self-test the packaged app
        shell: pwsh
        env:
          NEONDIAL_AUDIO_HELPER: ${{ github.workspace }}\launcher\build\Release\NeonDialAudio.exe
          NEONDIAL_LIBRESPOT: ${{ github.workspace }}\librespot-src\target\release\librespot.exe
        run: |
          Start-Process -FilePath companion\dist\NeonDial.exe -ArgumentList "--selftest","selftest.txt" -Wait
          if (-not (Test-Path selftest.txt)) { Write-Output "::error::selftest produced no report (exe crashed at startup)"; exit 1 }
          $t = (Get-Content selftest.txt) -join " | "
          if ($t -match "SELFTEST OK") { Write-Output "::notice::$t" } else { Write-Output "::error::$t"; exit 1 }
      - name: Package for Vortex
        run: python tools/make_vortex_zip.py companion/dist/NeonDial.exe launcher/build/Release/NeonDial.dll launcher/build/Release/NeonDialAudio.exe NeonDial-vortex.zip librespot-src/target/release/librespot.exe
      - uses: actions/upload-artifact@v4
        with: { name: NeonDial-vortex, path: NeonDial-vortex.zip }
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "${{ github.ref_name }}" NeonDial-vortex.zip --title "Neon Dial ${{ github.ref_name }}" --notes "Add NeonDial-vortex.zip to Vortex. Requires Cyber Engine Tweaks, RED4ext and RadioExt. Open your music app first, then tune to Neon Dial FM."
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
