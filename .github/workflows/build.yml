name: build-vortex-zip
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Unit tests
        run: |
          python -m pip install -r companion/requirements.txt pytest
          python -m pytest tests -q
      - name: Build RED4ext launcher plugin + audio helper
        run: |
          git clone https://github.com/WopsS/RED4ext.SDK launcher/RED4ext.SDK
          git -C launcher/RED4ext.SDK checkout a34f0ad0a9e4f37cbe1fe001e4ff68c2949d0665
          cmake -S launcher -B launcher/build -A x64
          cmake --build launcher/build --config Release
      - name: Fetch librespot source (pinned)
        run: |
          git clone https://github.com/librespot-org/librespot librespot-src
          git -C librespot-src checkout 15e02e86c72d96dd39d548e3749f00abe39ffdde
      - name: Cache librespot build
        id: ls-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: librespot-src/target/release/librespot.exe
          key: librespot-win-15e02e8
      - name: Build librespot (Spotify Connect receiver for the optional add-on)
        if: steps.ls-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 30
        run: cargo build --release --manifest-path librespot-src/Cargo.toml --no-default-features --features "native-tls with-libmdns"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with: { dotnet-version: "10.0.x" }
      - name: Build custom station icon (texture + archive)
        id: icon
        continue-on-error: true
        shell: pwsh
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          $ErrorActionPreference = "Continue"
          $log = New-Object System.Collections.Generic.List[string]
          function L($m) { $log.Add([string]$m) }
          function Run($label, [scriptblock]$sb) {
            $out = ((& $sb 2>&1 | Out-String).Trim()) -replace "\s+", " "
            L "[$label] exit=$LASTEXITCODE $($out.Substring(0, [Math]::Min(500, $out.Length)))"
          }
          Run "pillow" { python -m pip install pillow }
          Run "png" { python assets/icon/make_icon.py assets/icon/raw/mod/neondial/neon_dial_icon.png }
          Run "download" { gh release download 9.1.1 -R WolvenKit/WolvenKit -p "WolvenKit.Console-9.1.1.zip" -D wk --clobber }
          $h = (Get-FileHash wk/WolvenKit.Console-9.1.1.zip -Algorithm SHA256).Hash.ToLower()
          if ($h -ne "a14eae46931251635256e7b209cd4aa998ae5039a5fbd506fefaab671bf7f451") { throw "WolvenKit download hash mismatch: $h" }
          Expand-Archive wk/WolvenKit.Console-9.1.1.zip wk/cli -Force
          $cli = (Get-ChildItem wk/cli -Filter WolvenKit.CLI.exe -Recurse | Select-Object -First 1).FullName
          L "cli: $cli"
          New-Item -ItemType Directory -Force pack/NeonDial/mod/neondial | Out-Null
          Run "import" { & $cli import assets/icon/raw -o pack/NeonDial }
          Copy-Item assets/icon/neon_dial_icons.inkatlas pack/NeonDial/mod/neondial/
          L ("staged: " + ((Get-ChildItem pack -Recurse -File | ForEach-Object { $_.FullName.Replace($PWD.Path, "") }) -join "; "))
          Run "pack" { & $cli pack pack/NeonDial -o pack/out }
          L ("packed: " + ((Get-ChildItem pack/out -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object { "$($_.Name) $($_.Length)" }) -join "; "))
          New-Item -ItemType Directory -Force pack/check | Out-Null
          Run "serialize" { & $cli convert serialize pack/NeonDial/mod/neondial/neon_dial_icon.xbm -o pack/check }
          Run "verify" { python assets/icon/verify_icon.py pack/check }
          $text = $log -join " | "
          if ((Test-Path pack/out/NeonDial.archive) -and ($text -match "alpha range OK")) { Write-Output "::notice::ICON OK | $text" }
          else { Write-Output "::error::ICON PROBLEM | $text"; exit 1 }
      - name: Build companion exe
        working-directory: companion
        run: |
          python -m pip install -r requirements.txt pyinstaller
          python -m PyInstaller --noconfirm --onedir --windowed --name NeonDial --exclude-module numpy --exclude-module setuptools --exclude-module pkg_resources --exclude-module _distutils_hack --add-data "neondial/web;neondial/web" --collect-all webview --collect-all pythonnet --collect-all clr_loader run.py
      - name: Prune files Neon Dial never uses
        run: python tools/prune_bundle.py companion/dist/NeonDial
      - name: Self-test the packaged app
        shell: pwsh
        env:
          NEONDIAL_AUDIO_HELPER: ${{ github.workspace }}\launcher\build\Release\NeonDialAudio.exe
          NEONDIAL_LIBRESPOT: ${{ github.workspace }}\librespot-src\target\release\librespot.exe
        run: |
          Start-Process -FilePath companion\dist\NeonDial\NeonDial.exe -ArgumentList "--selftest","selftest.txt" -Wait
          if (-not (Test-Path selftest.txt)) { Write-Output "::error::selftest produced no report (exe crashed at startup)"; exit 1 }
          $t = (Get-Content selftest.txt) -join " | "
          if ($t -match "SELFTEST OK") { Write-Output "::notice::$t" } else { Write-Output "::error::$t"; exit 1 }
      - name: Collect third-party licences
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force licenses | Out-Null
          python -m venv licvenv
          licvenv\Scripts\python -m pip install -r companion/requirements.txt pip-licenses
          licvenv\Scripts\pip-licenses --from=mixed --with-license-file --no-license-path --with-notice-file --format=plain-vertical --ignore-packages pip-licenses prettytable wcwidth pip setuptools --output-file licenses/PYTHON_PACKAGES_LICENSES.txt
          $base = python -c "import sys;print(sys.base_prefix)"
          Copy-Item "$base\LICENSE.txt" licenses/PYTHON-LICENSE.txt
          Copy-Item launcher/RED4ext.SDK/LICENSE.md licenses/RED4ext-SDK-LICENSE.txt
          Copy-Item THIRD_PARTY_NOTICES.md licenses/THIRD_PARTY_NOTICES.md
          Copy-Item librespot-src/LICENSE licenses/librespot-LICENSE.txt -ErrorAction SilentlyContinue
          cargo metadata --manifest-path librespot-src/Cargo.toml --format-version 1 --filter-platform x86_64-pc-windows-msvc | python tools/rust_licenses.py | Out-File -Encoding utf8 licenses/librespot-dependencies.txt
          Get-ChildItem licenses | ForEach-Object { Write-Output "$($_.Name) $($_.Length)" }
      - name: Cross-check bundled packages against the licence notices
        shell: pwsh
        run: |
          $out = (python tools/check_licenses.py companion/dist/NeonDial licenses/PYTHON_PACKAGES_LICENSES.txt 2>&1 | Out-String)
          $code = $LASTEXITCODE
          $flat = ($out -replace "\s*\r?\n", " | ")
          if ($code -ne 0) { Write-Output "::error::LICENCES $flat"; exit 1 } else { Write-Output "::notice::LICENCES $flat" }
      - name: Package (main file and optional Spotify add-on)
        shell: pwsh
        run: |
          $ver = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "dev" }
          $args = @("tools/make_packages.py","--version",$ver,"--dist","companion/dist/NeonDial","--dll","launcher/build/Release/NeonDial.dll","--helper","launcher/build/Release/NeonDialAudio.exe","--licenses","licenses","--out","out")
          if (Test-Path pack/out/NeonDial.archive) { $args += @("--icon","pack/out/NeonDial.archive") }
          if (Test-Path librespot-src/target/release/librespot.exe) { $args += @("--librespot","librespot-src/target/release/librespot.exe") }
          python @args
          Get-ChildItem out | ForEach-Object { Write-Output "$($_.Name) $($_.Length)" }
      - name: Verify the release files (manifest, licences, no secrets, expected executables only)
        shell: pwsh
        run: python tools/verify_release.py (Get-ChildItem out -Filter *.zip | ForEach-Object { $_.FullName })
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: NeonDial-release, path: out/*.zip }
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: NeonDial-release }
      - name: Publish release
        run: |
          gh release create "${{ github.ref_name }}" *.zip --repo "${{ github.repository }}" --title "Neon Dial ${{ github.ref_name }}" --notes "Main file - NeonDial-${{ github.ref_name }}.zip (install with Vortex). Optional - NeonDial-SpotifyAddon-${{ github.ref_name }}.zip adds Standalone Spotify mode. Requires Cyber Engine Tweaks, RED4ext and RadioExt. AI disclosure, licences and privacy are documented in the repository (docs/NEXUS_SUBMISSION.md, THIRD_PARTY_NOTICES.md, SECURITY.md)."
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
