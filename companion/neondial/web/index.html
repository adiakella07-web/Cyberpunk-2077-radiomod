<!doctype html><meta charset=utf-8><title>Neon Dial</title>
<meta name=viewport content="width=device-width,initial-scale=1">
<style>
:root{--y:#fcee0a;--c:#00f0ff;--bg:#0b0b10;--p:#16161f}
body{background:var(--bg);color:#ddd;font:15px/1.4 system-ui,sans-serif;max-width:640px;margin:auto;padding:24px}
h1{color:var(--y);letter-spacing:2px;text-transform:uppercase;margin:0 0 4px}
.sub{color:var(--c);margin-bottom:18px}
.card{background:var(--p);border:1px solid #2a2a3a;border-left:3px solid var(--y);padding:12px 16px;margin:12px 0}
button,select{background:var(--y);color:#000;border:0;padding:8px 14px;font-weight:700;cursor:pointer;margin:3px 6px 3px 0}
button.alt,select{background:#2a2a3a;color:#fff}
.err{color:#ff7a7a}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#555;margin-right:6px}
</style>
<h1>Neon Dial</h1><div class=sub>Your music app, as an in-game radio station.</div>
<div class=card id=status>loading…</div>
<div class=card>
 <button onclick="ctl('prev')">⏮ Prev</button><button onclick="ctl('next')">⏭ Next</button>
 <button class=alt onclick="ctl('play')">Test play</button><button class=alt onclick="ctl('pause')">Test pause</button>
</div>
<div class=card>
 Mode: <select id=mode onchange="setMode()">
  <option value=system>Music app (Apple Music / Spotify, must be open)</option>
  <option value=standalone>Standalone Spotify (no app needed, Premium)</option>
  <option value=apple-standalone>Standalone Apple Music (no app needed)</option></select>
 <div id=standaloneBox style="display:none;margin-top:8px;color:#9ab"></div>
</div>
<div class=card id=appCard>
 Music app: <select id=app onchange="setApp()">
  <option value=auto>Auto-detect</option><option value=apple>Apple Music</option><option value=spotify>Spotify</option><option value=itunes>iTunes</option>
 </select>
 Audio: <select id=out onchange="setOut()"><option value=game>Through the game's radio mix</option><option value=speakers>Plain speakers</option></select>
 <button class=alt onclick="quitApp()">Quit companion</button>
 <div style="color:#888;margin-top:8px">Pick your playlist in the music app itself. Tune in to the station in-game and it plays; tune out and it pauses.</div>
</div>
<div class=card style="font:12px monospace;color:#9ab"><b>Activity</b><div id=logbox>-</div></div>
<script>
const j=async(u,o)=>(await fetch(u,o)).json();
const post=(u,b)=>j(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});
async function ctl(a){const r=await post("/api/control",{action:a});if(r.error)alert(r.error)}
async function setApp(){await post("/api/music_app",{music_app:document.getElementById("app").value})}
async function setOut(){await post("/api/output",{output:document.getElementById("out").value})}
async function setMode(){await post("/api/mode",{mode:document.getElementById("mode").value})}
async function win(v){const r=await post("/api/window",{show:v});if(r.error)alert(r.error)}
async function quitApp(){await post("/api/quit",{});document.getElementById("status").textContent="Companion stopped."}
let first=true;
async function refresh(){
  const S=await j("/api/state"),n=S.now||{};
  if(first){document.getElementById("mode").value=S.provider;document.getElementById("app").value=S.music_app||"auto";document.getElementById("out").value=S.output||"game";first=false}
  let h='<span class=dot style="background:'+(S.tuned_in?"#3dff7a":"#555")+'"></span><b>'+(S.tuned_in?"Tuned in":"Idle")+"</b>";
  const ap=S.provider==="apple-standalone"; const sa=S.provider==="standalone"||ap;
  document.getElementById("appCard").style.display=sa?"none":"block";
  const box=document.getElementById("standaloneBox"); box.style.display=sa?"block":"none";
  if(ap){box.innerHTML=(S.apple_status||"")+'<br><button class=alt onclick="win(true)">Show Apple Music window</button><button class=alt onclick="win(false)">Hide window</button><br>First time: click Show window, sign in to Apple Music, start a playlist, then Hide window.'}
  else if(sa){box.textContent=(S.librespot_found?"":"librespot.exe is missing from the mod folder. ")+(S.standalone_status||"")+" - First time: log in to Spotify in the browser window that opens, then in any Spotify app choose the device \"Neon Dial FM\" and play a playlist. You can then close Spotify."}
  if(n.title)h+="<br><br>♪ "+n.title+" — "+(n.artist||"")+(n.playing?"":" (paused)");
  if(S.output==="game"&&!sa){h+="<br>Audio path: "+(S.capturing?"<b>game radio mix</b> (capturing)":(S.fallback?"speakers (fallback)":(S.helper_found?"game radio mix (starts when you tune in)":"helper missing - using speakers")))}
  if(S.fallback)h+='<br><span class=err></span>';
  const e=S.error||S.provider_error; if(e)h+='<br><br><span class=err></span>';
  document.getElementById("logbox").innerText=(S.log||[]).join("\n")||"-";
  const el=document.getElementById("status"); el.innerHTML=h; const ee=el.querySelectorAll(".err"); const msgs=[S.fallback,e].filter(Boolean); ee.forEach((x,i)=>x.textContent=msgs[i]||"");
}
refresh(); setInterval(refresh,3000);
</script>
